apiVersion: v1
kind: Secret
metadata:
  name: autoheal-secrets
  namespace: autoheal
type: Opaque
stringData:
  # These should be fetched from AWS Secrets Manager in production
  # For now, base64 encode and set via kubectl or CI/CD
  DB_CONNECTION_STRING: "postgres://user:password@db-host:5432/autoheal_cloud"
  API_KEY: "your-api-key-here"
---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry
  namespace: autoheal
type: kubernetes.io/dockercfg
data:
  # Base64-encoded Docker config for pulling from private registry
  # For Docker Hub: kubectl create secret docker-registry docker-registry --docker-server=docker.io --docker-username=monothecreator --docker-password=YOUR_TOKEN
  .dockercfg: {}
