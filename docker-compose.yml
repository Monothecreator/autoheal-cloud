version: '3.8'
services:
  app:
    image: app:local
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) process.exit(1)})\""]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
