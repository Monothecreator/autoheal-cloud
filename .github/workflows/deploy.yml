name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write      # for OIDC auth to AWS
  packages: write       # for pushing to GHCR

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      # Container scan runs here too — build is not "done" until this passes
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev   # no required reviewers - deploys immediately
    steps:
      - name: Deploy image to dev
        run: |
          echo "Deploying ${{ needs.build.outputs.image_tag }} to dev"
          # kubectl / helm upgrade / argo cd sync commands go here

  deploy-staging:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: staging   # optional reviewer gate, configured in GitHub UI
    steps:
      - name: Deploy image to staging
        run: |
          echo "Deploying ${{ needs.build.outputs.image_tag }} to staging"

      - name: Smoke test staging
        run: |
          echo "Run smoke tests / DAST scan against staging here"

  deploy-prod:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: prod   # required reviewers enforced here automatically by GitHub
    steps:
      - name: Deploy image to prod
        run: |
          echo "Deploying ${{ needs.build.outputs.image_tag }} to prod"
